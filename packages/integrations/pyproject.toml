[project]
name = "integrations"
version = "0.1.0"
description = "GitHub App client - PR diff/comments/review posting, webhook signature validation; GitLab stub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "notion-client>=3.1.0",
    "PyGithub",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integrations"]
