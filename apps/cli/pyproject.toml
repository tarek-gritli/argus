[project]
name = "cli"
version = "0.1.0"
description = "Typer CLI for local pre-commit review and login"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "platformdirs>=4",
]

[project.scripts]
argus = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
