[project]
name = "agents"
version = "0.1.0"
description = "LangGraph orchestrator - parallel fan-out to security, quality, and testing agents; fix suggestion engine (generator → validator → scorer); Celery workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery",
    "shared",
    "integrations",
    "anthropic>=0.95.0",
    "google-genai>=1.0.0",
    "langgraph>=1.1.6",
    "context",
]

[project.scripts]
agents = "agents_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
context = { workspace = true }

[dependency-groups]
dev = [
    "watchdog[watchmedo]>=6.0.0",
]
