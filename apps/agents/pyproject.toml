[project]
name = "agents"
version = "0.1.0"
description = "LangGraph orchestrator - fans out to specialized LLM agents in parallel (security, quality, performance, testing, docs, best practices), fix suggestion engine, Celery workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agents = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
