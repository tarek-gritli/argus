[project]
name = "gateway"
version = "0.1.0"
description = "FastAPI API gateway - GitHub/GitLab webhooks, authentication, rate limiting, routes review jobs to queue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "integrations",
    "celery>=5.6.3",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "redis>=7.4.0",
    "uvicorn>=0.44.0",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
integrations = { workspace = true }
shared = { workspace = true }
