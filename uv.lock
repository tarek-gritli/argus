version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "argus",
    "argus-agents",
    "argus-cli",
    "argus-context",
    "argus-gateway",
    "argus-integrations",
    "argus-shared",
]

[[package]]
name = "argus"
version = "0.1.0"
source = { virtual = "." }

[[package]]
name = "argus-agents"
version = "0.1.0"
source = { virtual = "apps/agents" }

[[package]]
name = "argus-cli"
version = "0.1.0"
source = { virtual = "apps/cli" }

[[package]]
name = "argus-context"
version = "0.1.0"
source = { virtual = "packages/context" }

[[package]]
name = "argus-gateway"
version = "0.1.0"
source = { virtual = "apps/gateway" }

[[package]]
name = "argus-integrations"
version = "0.1.0"
source = { virtual = "packages/integrations" }

[[package]]
name = "argus-shared"
version = "0.1.0"
source = { virtual = "packages/shared" }
