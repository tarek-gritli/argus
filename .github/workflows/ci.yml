name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --all-packages

    - name: Lint
      run: make lint

    - name: Format check
      run: uv run ruff format --check .

    - name: Type check
      run: make typecheck

    - name: Tests
      run: make test
