name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: argus-linux-x86_64
          - os: macos-15-intel
            asset_name: argus-darwin-x86_64
          - os: macos-latest
            asset_name: argus-darwin-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build binary
        run: |
          cd apps/cli
          uv sync --group build
          uv run pyinstaller argus.spec --clean --noconfirm

      - name: Rename binary
        run: mv apps/cli/dist/argus apps/cli/dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: apps/cli/dist/${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            argus-linux-x86_64/argus-linux-x86_64 \
            argus-darwin-x86_64/argus-darwin-x86_64 \
            argus-darwin-arm64/argus-darwin-arm64 \
            | sed 's| [^ ]*/|  |' > checksums.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          if echo "$TAG" | grep -q "-"; then PRERELEASE="--prerelease"; fi

          ASSETS="dist/argus-linux-x86_64/argus-linux-x86_64 dist/argus-darwin-x86_64/argus-darwin-x86_64 dist/argus-darwin-arm64/argus-darwin-arm64 dist/checksums.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" \
              --title "Argus CLI $TAG" \
              --notes "## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/install.sh | sh
          \`\`\`

          ## Assets
          - \`argus-linux-x86_64\` — Linux x86_64
          - \`argus-darwin-x86_64\` — macOS Intel
          - \`argus-darwin-arm64\` — macOS Apple Silicon (M1/M2/M3)" \
              $PRERELEASE \
              $ASSETS
          fi
