name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: argus-linux-x86_64
          - os: macos-13
            asset_name: argus-darwin-x86_64
          - os: macos-latest
            asset_name: argus-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build binary
        run: |
          cd apps/cli
          uv sync --group build
          uv run pyinstaller argus.spec --clean --noconfirm

      - name: Rename binary
        run: mv apps/cli/dist/argus apps/cli/dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: apps/cli/dist/${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          if echo "$TAG" | grep -q "-"; then PRERELEASE="--prerelease"; fi

          gh release create "$TAG" \
            --title "Argus CLI $TAG" \
            --notes "## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | sh
          \`\`\`

          ## Assets
          - \`argus-linux-x86_64\` — Linux x86_64
          - \`argus-darwin-x86_64\` — macOS Intel
          - \`argus-darwin-arm64\` — macOS Apple Silicon (M1/M2/M3)" \
            $PRERELEASE \
            dist/argus-linux-x86_64/argus-linux-x86_64 \
            dist/argus-darwin-x86_64/argus-darwin-x86_64 \
            dist/argus-darwin-arm64/argus-darwin-arm64
