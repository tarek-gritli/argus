name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless auth via Workload Identity Federation

env:
  GCP_REGION: europe-west1
  AR_REPOSITORY: argus

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install gcloud beta component
        run: gcloud components install beta --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push gateway image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/gateway:${{ github.sha }}
        run: |
          docker build -f apps/gateway/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push agents image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/agents:${{ github.sha }}
        run: |
          docker build -f apps/agents/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy gateway (Cloud Run Service)
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/gateway:${{ github.sha }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_GATEWAY_SERVICE_ACCOUNT }}
          SECRETS: >-
            GITHUB_WEBHOOK_SECRET=github-webhook-secret:latest,
            GITHUB_APP_ID=github-app-id:latest,
            GITHUB_PRIVATE_KEY_B64=github-private-key-b64:latest,
            GITHUB_CLIENT_ID=github-client-id:latest,
            GITHUB_CLIENT_SECRET=github-client-secret:latest,
            JWT_SECRET_KEY=jwt-secret-key:latest,
            SECRET_ENCRYPTION_KEY=secret-encryption-key:latest,
            STRIPE_SECRET_KEY=stripe-secret-key:latest,
            STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,
            STRIPE_PRO_PRICE_ID=stripe-pro-price-id:latest,
            STRIPE_TEAM_PRICE_ID=stripe-team-price-id:latest,
            DATABASE_URL=database-url:latest,
            REDIS_URL=redis-url:latest,
            CELERY_BROKER_URL=celery-broker-url:latest
        run: |
          gcloud run deploy argus-gateway \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$SERVICE_ACCOUNT" \
            --set-secrets="$(echo "$SECRETS" | tr -d '\n ')" \
            --quiet

      - name: Deploy agents (Cloud Run Worker Pool)
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/agents:${{ github.sha }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_AGENTS_SERVICE_ACCOUNT }}
          SECRETS: >-
            ANTHROPIC_API_KEY=anthropic-api-key:latest,
            VOYAGE_API_KEY=voyage-api-key:latest,
            GITHUB_PRIVATE_KEY_B64=github-private-key-b64:latest,
            GITHUB_APP_ID=github-app-id:latest,
            SECRET_ENCRYPTION_KEY=secret-encryption-key:latest,
            DATABASE_URL=database-url:latest,
            REDIS_URL=redis-url:latest,
            CELERY_BROKER_URL=celery-broker-url:latest,
            QDRANT_URL=qdrant-url:latest,
            QDRANT_API_KEY=qdrant-api-key:latest
        run: |
          gcloud beta run worker-pools deploy argus-agents \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$SERVICE_ACCOUNT" \
            --set-secrets="$(echo "$SECRETS" | tr -d '\n ')" \
            --quiet
