[project]
name = "argus"
version = "0.1.0"
description = "Argus: Multi-agent AI platform for automated code review at pull-request / merge-request level"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/gateway",
    "apps/agents",
    "apps/cli",
    "packages/shared",
    "packages/context",
    "packages/integrations",
]

[tool.uv.sources]
argus-shared = { workspace = true }
argus-context = { workspace = true }
argus-integrations = { workspace = true }


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, pyflakes, isort

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]