[project]
name = "argus"
version = "0.1.0"
description = "Argus: Multi-agent AI platform for automated code review at pull-request / merge-request level"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/gateway",
    "apps/agents",
    "apps/cli",
    "packages/shared",
    "packages/context",
    "packages/integrations",
]

[tool.uv.sources]
shared = { workspace = true }
context = { workspace = true }
integrations = { workspace = true }


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, pyflakes, isort

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pyright>=1.1.300",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]
